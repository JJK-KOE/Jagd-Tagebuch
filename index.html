  <title>Strecke Kavelstorf</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    :root{
      --bg:#ffffff;--bg2:#f5f5f5;--bg3:#ebebeb;
      --text:#1a1a1a;--text2:#666666;--text3:#999999;
      --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.2);
      --green-bg:#eaf6ee;--green-text:#1e7e3a;
      --blue-bg:#e8f0fe;--blue-text:#1a56db;
      --red-bg:#fdecea;--red-text:#c0392b;
      --accent:#1a1a1a;--radius:10px;--radius-lg:14px;
    }
    @media(prefers-color-scheme:dark){
      :root{
        --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;
        --text:#f2f2f7;--text2:#aeaeb2;--text3:#6e6e73;
        --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.2);
        --green-bg:#0d3320;--green-text:#4cd964;
        --blue-bg:#0d2240;--blue-text:#4a9eff;
        --red-bg:#3a1010;--red-text:#ff6b6b;
        --accent:#f2f2f7;
      }
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
    .app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);}
    .header{padding:max(env(safe-area-inset-top),12px) 20px 12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg);position:sticky;top:0;z-index:10;}
    .header h1{font-size:20px;font-weight:600;color:var(--text);letter-spacing:-0.3px;}
    .season-badge{font-size:12px;font-weight:500;background:var(--blue-bg);color:var(--blue-text);padding:4px 10px;border-radius:20px;}
    .sync-bar{padding:5px 20px;background:var(--bg2);border-bottom:0.5px solid var(--border);font-size:12px;}
    .season-bar{display:flex;align-items:center;gap:8px;padding:10px 20px;background:var(--bg2);border-bottom:0.5px solid var(--border);}
    .season-bar label{font-size:13px;color:var(--text2);white-space:nowrap;}
    .season-bar select{flex:1;font-size:14px;font-weight:500;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-family:inherit;}
    .btn-small{flex-shrink:0;padding:7px 12px;font-size:13px;font-weight:500;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;}
    .tabs{display:flex;border-bottom:0.5px solid var(--border);background:var(--bg);position:sticky;top:57px;z-index:9;overflow-x:auto;}
    .tab{flex:1;min-width:60px;padding:11px 4px;font-size:12px;font-weight:400;color:var(--text2);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit;white-space:nowrap;}
    .tab.active{color:var(--text);border-bottom:2px solid var(--text);font-weight:600;}
    .content{flex:1;padding:16px 20px;overflow-y:auto;}
    .section{display:none;}.section.active{display:block;}
    .form-group{margin-bottom:13px;}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em;}
    .form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 13px;font-size:16px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:inherit;appearance:none;-webkit-appearance:none;outline:none;transition:border-color 0.15s;}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent);background:var(--bg);}
    .form-group textarea{resize:vertical;min-height:64px;line-height:1.5;}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .field-hint{font-size:12px;color:var(--text3);margin-top:3px;}
    .erleger-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
    .erleger-pill{padding:5px 12px;font-size:13px;background:var(--bg3);color:var(--text2);border:0.5px solid var(--border2);border-radius:20px;cursor:pointer;font-family:inherit;}
    .erleger-pill:active{background:var(--bg2);}
    .btn-save{width:100%;padding:14px;font-size:16px;font-weight:600;background:var(--text);color:var(--bg);border:none;border-radius:var(--radius-lg);cursor:pointer;margin-top:8px;font-family:inherit;transition:opacity 0.15s;}
    .btn-save:disabled{opacity:0.5;}
    .toast{padding:11px 14px;border-radius:var(--radius);font-size:14px;font-weight:500;margin-bottom:12px;display:none;}
    .toast.success{background:var(--green-bg);color:var(--green-text);}
    .toast.error{background:var(--red-bg);color:var(--red-text);}
    .filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
    .filter-bar select{flex:1;min-width:100px;font-size:13px;padding:7px 10px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg2);color:var(--text);font-family:inherit;appearance:none;-webkit-appearance:none;}
    .list-item{background:var(--bg2);border-radius:var(--radius-lg);padding:13px 15px;margin-bottom:9px;border:0.5px solid var(--border);}
    .list-top{display:flex;justify-content:space-between;align-items:flex-start;}
    .list-wildart{font-size:16px;font-weight:600;color:var(--text);}
    .list-right{display:flex;align-items:center;gap:6px;}
    .list-date{font-size:13px;color:var(--text2);}
    .icon-btn{font-size:14px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 4px;line-height:1;}
    .list-meta{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;}
    .pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:20px;background:var(--bg3);color:var(--text2);}
    .pill.green{background:var(--green-bg);color:var(--green-text);}
    .pill.blue{background:var(--blue-bg);color:var(--blue-text);}
    .list-revier{font-size:13px;color:var(--text2);margin-top:6px;}
    .list-erleger{font-size:13px;color:var(--text2);margin-top:3px;}
    .list-anm{font-size:13px;color:var(--text3);margin-top:3px;font-style:italic;line-height:1.4;}
    .photo-link{font-size:13px;color:var(--blue-text);margin-top:6px;cursor:pointer;text-decoration:underline;}
    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
    .stat-card{background:var(--bg2);border-radius:var(--radius-lg);padding:14px;border:0.5px solid var(--border);}
    .stat-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:5px;}
    .stat-value{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-0.5px;line-height:1;}
    .chart-section{margin-bottom:20px;}
    .chart-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2);margin-bottom:10px;padding-bottom:6px;border-bottom:0.5px solid var(--border);}
    .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
    .bar-lbl{font-size:12px;color:var(--text2);width:120px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .bar-track{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden;}
    .bar-fill{height:100%;background:var(--text);border-radius:3px;}
    .bar-n{font-size:12px;color:var(--text2);min-width:20px;text-align:right;font-weight:500;}
    .sub-section{margin-bottom:24px;}
    .sub-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:12px;}
    .export-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-lg);padding:18px;}
    .export-card p{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:14px;}
    .export-btn{width:100%;padding:12px;font-size:14px;font-weight:500;background:var(--bg);color:var(--text);border:0.5px solid var(--border2);border-radius:var(--radius);cursor:pointer;margin-bottom:8px;font-family:inherit;text-align:left;display:flex;align-items:center;gap:10px;}
    .export-icon{font-size:18px;}
    .empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:15px;line-height:1.6;}
    .photo-upload-area{border:1.5px dashed var(--border2);border-radius:var(--radius);background:var(--bg2);padding:16px;text-align:center;cursor:pointer;position:relative;}
    .photo-upload-area input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;background:none;padding:0;}
    .upload-icon{font-size:26px;margin-bottom:5px;}
    .upload-text{font-size:14px;color:var(--text2);font-weight:500;}
    .upload-sub{font-size:12px;color:var(--text3);margin-top:2px;}
    .photo-preview-wrap{position:relative;}
    .photo-preview-wrap img{width:100%;border-radius:var(--radius);display:block;max-height:200px;object-fit:cover;border:0.5px solid var(--border);}
    .photo-remove-btn{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:20px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
    /* EDIT MODAL */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
    .modal{background:var(--bg);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:90dvh;overflow-y:auto;}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
    .modal-title{font-size:17px;font-weight:600;color:var(--text);}
    .modal-close{font-size:20px;color:var(--text3);background:none;border:none;cursor:pointer;}
    .btn-danger{width:100%;padding:13px;font-size:15px;font-weight:500;background:var(--red-bg);color:var(--red-text);border:none;border-radius:var(--radius);cursor:pointer;margin-top:8px;font-family:inherit;}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🦌 Strecke Kavelstorf</h1>
    <span class="season-badge" id="season-badge">–</span>
  </div>
  <div class="sync-bar"><span id="sync-status" style="color:var(--text3);">○ Verbinde …</span></div>
  <div class="season-bar">
    <label>Saison</label>
    <select id="season-select" onchange="onSeasonChange()"></select>
    <button class="btn-small" onclick="addSeason()">+ Neu</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('erfassen')">Erfassen</button>
    <button class="tab" onclick="switchTab('liste')">Strecke</button>
    <button class="tab" onclick="switchTab('statistik')">Statistik</button>
    <button class="tab" onclick="switchTab('export')">Export</button>
  </div>
  <div class="content">

    <!-- ERFASSEN -->
    <div class="section active" id="tab-erfassen">
      <div class="toast success" id="toast-success"></div>
      <div class="toast error" id="toast-error"></div>
      <div class="form-group">
        <label>Wildart</label>
        <select id="wildart">
          <option value="">Bitte wählen …</option>
          <option>Schwarzwild</option><option>Rotwild</option><option>Rehwild</option>
        </select>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Wildmarkennummer</label>
          <input type="text" id="marke" placeholder="0000000" maxlength="7" inputmode="numeric"
            oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,7);updateHint()" />
          <div class="field-hint" id="marke-hint">0 / 7 Ziffern</div>
        </div>
        <div class="form-group">
          <label>Geschlecht</label>
          <select id="geschlecht">
            <option value="">–</option><option>Männlich</option><option>Weiblich</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Gewicht (kg)</label>
          <input type="number" id="gewicht" placeholder="0.0" step="0.1" min="0" inputmode="decimal" />
        </div>
        <div class="form-group">
          <label>Altersklasse (AK)</label>
          <select id="ak">
            <option value="">–</option>
            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>Revier</label>
        <select id="revier">
          <option value="">Bitte wählen …</option>
          <option>GJB Kavelstorf III</option><option>Jahning</option>
        </select>
      </div>
      <div class="form-group">
        <label>Erleger (Vor- und Nachname)</label>
        <input type="text" id="erleger" placeholder="z.B. Max Mustermann" />
        <div class="erleger-suggestions" id="erleger-suggestions"></div>
      </div>
      <div class="form-group">
        <label>Datum</label>
        <input type="date" id="datum" />
      </div>
      <div class="form-group">
        <label>Anmerkung</label>
        <textarea id="anmerkung" placeholder="Besonderheiten, Wildunfall, Standort …"></textarea>
      </div>
      <div class="form-group">
        <label>Foto Wildmarke</label>
        <div class="photo-upload-area" id="photo-upload-area">
          <input type="file" id="photo-input" accept="image/*" onchange="onPhotoSelected(event)" />
          <div class="upload-icon">📷</div>
          <div class="upload-text">Foto aufnehmen oder aus Bibliothek</div>
          <div class="upload-sub">Kamera oder Fotobibliothek wählen</div>
        </div>
        <div class="photo-preview-wrap" id="photo-preview-wrap" style="display:none;margin-top:10px;">
          <img id="photo-preview" src="" alt="Wildmarke Foto" />
          <button class="photo-remove-btn" onclick="removePhoto()">✕ Entfernen</button>
        </div>
      </div>
      <button class="btn-save" onclick="saveEntry()">Eintrag speichern</button>
    </div>

    <!-- STRECKE -->
    <div class="section" id="tab-liste">
      <div class="filter-bar">
        <select id="filter-wild" onchange="renderListe()"><option value="">Alle Wildarten</option></select>
        <select id="filter-revier" onchange="renderListe()"><option value="">Alle Reviere</option></select>
        <select id="filter-erleger" onchange="renderListe()"><option value="">Alle Erleger</option></select>
      </div>
      <div id="liste-content"></div>
    </div>

    <!-- STATISTIK -->
    <div class="section" id="tab-statistik">
      <div id="stats-content"></div>
    </div>

    <!-- EXPORT -->
    <div class="section" id="tab-export">
      <div class="export-card">
        <p>Wähle die Saison und exportiere alle Abschüsse als CSV für Excel oder Numbers.</p>
        <div class="form-group">
          <label>Saison auswählen</label>
          <select id="export-season-select"></select>
        </div>
        <button class="export-btn" onclick="exportCSV()">
          <span class="export-icon">📋</span> CSV herunterladen
        </button>
      </div>
    </div>

  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal" style="display:none;" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Eintrag bearbeiten</span>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="form-group">
      <label>Wildart</label>
      <select id="edit-wildart">
        <option value="">Bitte wählen …</option>
        <option>Schwarzwild</option><option>Rotwild</option><option>Rehwild</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Wildmarkennummer</label>
        <input type="text" id="edit-marke" placeholder="0000000" maxlength="7" inputmode="numeric"
          oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,7)" />
      </div>
      <div class="form-group">
        <label>Geschlecht</label>
        <select id="edit-geschlecht">
          <option value="">–</option><option>Männlich</option><option>Weiblich</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Gewicht (kg)</label>
        <input type="number" id="edit-gewicht" placeholder="0.0" step="0.1" min="0" inputmode="decimal" />
      </div>
      <div class="form-group">
        <label>Altersklasse (AK)</label>
        <select id="edit-ak">
          <option value="">–</option>
          <option value="0">0</option><option value="1">1</option><option value="2">2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Revier</label>
      <select id="edit-revier">
        <option value="">Bitte wählen …</option>
        <option>GJB Kavelstorf III</option><option>Jahning</option>
      </select>
    </div>
    <div class="form-group">
      <label>Erleger</label>
      <input type="text" id="edit-erleger" placeholder="Vor- und Nachname" />
    </div>
    <div class="form-group">
      <label>Datum</label>
      <input type="date" id="edit-datum" />
    </div>
    <div class="form-group">
      <label>Anmerkung</label>
      <textarea id="edit-anmerkung" placeholder="Besonderheiten, Wildunfall, Standort …"></textarea>
    </div>
    <button class="btn-save" onclick="saveEdit()">Änderungen speichern</button>
    <button class="btn-danger" onclick="deleteFromModal()">Eintrag löschen</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey:"AIzaSyDjpox0VLVHz0ztv7IsCuCxp9fgqXTQQTo",
    authDomain:"strecke-kavelstorf.firebaseapp.com",
    projectId:"strecke-kavelstorf",
    storageBucket:"strecke-kavelstorf.firebasestorage.app",
    messagingSenderId:"797083613111",
    appId:"1:797083613111:web:f607fd434fe0f946a91a32"
  });
  const db = firebase.firestore();

  let allEntries = [];
  let availableSeasons = [];
  let currentSeason = '';
  let currentPhotoBase64 = null;
  let editingDocId = null;

  // ── Firebase listeners ─────────────────────────────────────────
  db.collection('entries').orderBy('id','desc').onSnapshot(snap => {
    allEntries = snap.docs.map(d => ({...d.data(), _docId:d.id}));
    rebuildSeasons();
    renderAll();
    setStatus('online');
    checkNewEntries();
  }, err => { console.error(err); setStatus('offline'); });

  db.collection('seasons').orderBy('label','desc').onSnapshot(snap => {
    const fromDb = snap.docs.map(d => d.data().label);
    mergeSeasons(fromDb);
  }, ()=>{});

  function setStatus(s) {
    const el = document.getElementById('sync-status');
    if(!el) return;
    el.textContent = s==='online' ? '● Synchronisiert' : '○ Offline';
    el.style.color = s==='online' ? 'var(--green-text)' : 'var(--red-text)';
  }

  // ── Seasons ────────────────────────────────────────────────────
  function getSeason(dateStr) {
    if(!dateStr) return null;
    const d=new Date(dateStr), y=d.getFullYear(), m=d.getMonth()+1;
    return m>=4 ? y+'/'+(y+1) : (y-1)+'/'+y;
  }
  function currentSeasonNow() {
    const d=new Date(), m=d.getMonth()+1, y=d.getFullYear();
    return m>=4 ? y+'/'+(y+1) : (y-1)+'/'+y;
  }
  function mergeSeasons(extra) {
    const fromEntries = allEntries.map(e=>getSeason(e.datum)).filter(Boolean);
    const merged = [...new Set([...availableSeasons,...extra,...fromEntries,currentSeasonNow()])].sort().reverse();
    availableSeasons = merged;
    buildSeasonSelect();
    buildExportSeasonSelect();
  }
  function rebuildSeasons() { mergeSeasons([]); }
  function buildSeasonSelect() {
    const sel = document.getElementById('season-select');
    if(!sel) return;
    const prev = currentSeason || currentSeasonNow();
    sel.innerHTML = availableSeasons.map(s=>`<option value="${s}">Saison ${s}</option>`).join('');
    currentSeason = availableSeasons.includes(prev) ? prev : (availableSeasons[0]||currentSeasonNow());
    sel.value = currentSeason;
    document.getElementById('season-badge').textContent = currentSeason;
  }
  function buildExportSeasonSelect() {
    const sel = document.getElementById('export-season-select');
    if(!sel) return;
    const prev = sel.value;
    sel.innerHTML = availableSeasons.map(s=>`<option value="${s}">Saison ${s}</option>`).join('');
    if(availableSeasons.includes(prev)) sel.value = prev;
  }
  function onSeasonChange() {
    currentSeason = document.getElementById('season-select').value;
    document.getElementById('season-badge').textContent = currentSeason;
    populateFilters(); renderListe(); renderStats();
  }
  function addSeason() {
    const input = prompt('Neue Jagdsaison (Format: JJJJ/JJJJ, z.B. 2025/2026):');
    if(!input) return;
    const t = input.trim();
    if(!/^\d{4}\/\d{4}$/.test(t)) { alert('Bitte Format JJJJ/JJJJ verwenden, z.B. 2025/2026'); return; }
    db.collection('seasons').add({label:t}).then(()=>{
      showToast('success','✓ Saison '+t+' hinzugefügt!');
    }).catch(e=>showToast('error','Fehler: '+e.message));
  }

  // ── Erleger suggestions ────────────────────────────────────────
  function getKnownErleger() {
    return [...new Set(allEntries.map(e=>e.erleger).filter(Boolean))].sort();
  }
  function updateErlegerSuggestions() {
    const val = document.getElementById('erleger').value.toLowerCase();
    const known = getKnownErleger();
    const filtered = val ? known.filter(e=>e.toLowerCase().includes(val)) : known;
    const container = document.getElementById('erleger-suggestions');
    container.innerHTML = filtered.map(e=>`<button class="erleger-pill" onclick="selectErleger('${e}')">${e}</button>`).join('');
  }
  function selectErleger(name) {
    document.getElementById('erleger').value = name;
    document.getElementById('erleger-suggestions').innerHTML = '';
  }
  document.addEventListener('DOMContentLoaded', ()=>{
    const inp = document.getElementById('erleger');
    if(inp) inp.addEventListener('input', updateErlegerSuggestions);
    inp.addEventListener('focus', updateErlegerSuggestions);
  });

  // ── UI ─────────────────────────────────────────────────────────
  function renderAll() { populateFilters(); renderListe(); renderStats(); }
  function getSeasonEntries(season) { return allEntries.filter(e=>getSeason(e.datum)===season); }
  function populateFilters() {
    const entries = getSeasonEntries(currentSeason);
    const wilds = [...new Set(entries.map(e=>e.wildart).filter(Boolean))].sort();
    const reviere = [...new Set(entries.map(e=>e.revier).filter(Boolean))].sort();
    const erleger = [...new Set(entries.map(e=>e.erleger).filter(Boolean))].sort();
    const fw=document.getElementById('filter-wild'), fr=document.getElementById('filter-revier'), fe=document.getElementById('filter-erleger');
    if(!fw||!fr||!fe) return;
    const sw=fw.value, sr=fr.value, se=fe.value;
    fw.innerHTML='<option value="">Alle Wildarten</option>'+wilds.map(w=>`<option>${w}</option>`).join('');
    fr.innerHTML='<option value="">Alle Reviere</option>'+reviere.map(r=>`<option>${r}</option>`).join('');
    fe.innerHTML='<option value="">Alle Erleger</option>'+erleger.map(e=>`<option>${e}</option>`).join('');
    if(wilds.includes(sw)) fw.value=sw;
    if(reviere.includes(sr)) fr.value=sr;
    if(erleger.includes(se)) fe.value=se;
  }
  function getFilteredEntries() {
    const fw=document.getElementById('filter-wild').value;
    const fr=document.getElementById('filter-revier').value;
    const fe=document.getElementById('filter-erleger').value;
    let e=getSeasonEntries(currentSeason);
    if(fw) e=e.filter(x=>x.wildart===fw);
    if(fr) e=e.filter(x=>x.revier===fr);
    if(fe) e=e.filter(x=>x.erleger===fe);
    return e;
  }
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t,i)=>{
      t.classList.toggle('active',['erfassen','liste','statistik','export'][i]===tab);
    });
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.add('active');
    if(tab==='liste'){populateFilters();renderListe();}
    if(tab==='statistik') renderStats();
    if(tab==='export') buildExportSeasonSelect();
  }
  function showToast(type,msg) {
    const el=document.getElementById('toast-'+type);
    if(!el) return;
    el.textContent=msg||'';
    el.style.display='block';
    setTimeout(()=>el.style.display='none',3000);
  }
  function updateHint() {
    document.getElementById('marke-hint').textContent=document.getElementById('marke').value.length+' / 7 Ziffern';
  }

  // ── Photo ──────────────────────────────────────────────────────
  function onPhotoSelected(event) {
    const file=event.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement('canvas');
        const MAX=800; let w=img.width,h=img.height;
        if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
        if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        currentPhotoBase64=canvas.toDataURL('image/jpeg',0.65);
        document.getElementById('photo-preview').src=currentPhotoBase64;
        document.getElementById('photo-preview-wrap').style.display='block';
        document.getElementById('photo-upload-area').style.display='none';
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }
  function removePhoto() {
    currentPhotoBase64=null;
    const pi=document.getElementById('photo-input'); if(pi) pi.value='';
    document.getElementById('photo-preview').src='';
    document.getElementById('photo-preview-wrap').style.display='none';
    document.getElementById('photo-upload-area').style.display='block';
  }

  // ── Save new entry ─────────────────────────────────────────────
  async function saveEntry() {
    const wildart=document.getElementById('wildart').value;
    const marke=document.getElementById('marke').value;
    if(!wildart){showToast('error','Bitte Wildart auswählen.');return;}
    if(marke&&marke.length!==7){showToast('error','Wildmarkennummer muss genau 7 Ziffern haben.');return;}
    const btn=document.querySelector('#tab-erfassen .btn-save');
    btn.disabled=true; btn.textContent='Speichert …';
    setTimeout(()=>{ btn.disabled=false; btn.textContent='Eintrag speichern'; }, 3000);
    const entry={
      id:Date.now(), wildart, marke:marke||'',
      geschlecht:document.getElementById('geschlecht').value||'',
      gewicht:document.getElementById('gewicht').value||'',
      ak:document.getElementById('ak').value||'',
      revier:document.getElementById('revier').value||'',
      erleger:document.getElementById('erleger').value.trim()||'',
      datum:document.getElementById('datum').value||'',
      anmerkung:document.getElementById('anmerkung').value||'',
      photo:currentPhotoBase64||null
    };
    try {
      await db.collection('entries').add(entry);
      ['wildart','marke','geschlecht','gewicht','ak','revier','erleger','anmerkung'].forEach(id=>{
        const el=document.getElementById(id); if(el) el.value='';
      });
      updateHint(); removePhoto();
      document.getElementById('erleger-suggestions').innerHTML='';
      document.getElementById('datum').value=new Date().toISOString().split('T')[0];
      showToast('success','✓ Eintrag gespeichert!');
    } catch(e){
      showToast('error','Fehler: '+e.message);
      console.error(e);
    }
  }

  // ── Edit modal ─────────────────────────────────────────────────
  function openEditModal(id) {
    const e=allEntries.find(x=>x.id==id); if(!e) return;
    editingDocId=e._docId;
    document.getElementById('edit-wildart').value=e.wildart||'';
    document.getElementById('edit-marke').value=e.marke||'';
    document.getElementById('edit-geschlecht').value=e.geschlecht||'';
    document.getElementById('edit-gewicht').value=e.gewicht||'';
    document.getElementById('edit-ak').value=e.ak||'';
    document.getElementById('edit-revier').value=e.revier||'';
    document.getElementById('edit-erleger').value=e.erleger||'';
    document.getElementById('edit-datum').value=e.datum||'';
    document.getElementById('edit-anmerkung').value=e.anmerkung||'';
    document.getElementById('edit-modal').style.display='flex';
  }
  function closeEditModal() {
    document.getElementById('edit-modal').style.display='none';
    editingDocId=null;
  }
  function closeModal(event) {
    if(event.target===document.getElementById('edit-modal')) closeEditModal();
  }
  async function saveEdit() {
    if(!editingDocId) return;
    const marke=document.getElementById('edit-marke').value;
    if(marke&&marke.length!==7){alert('Wildmarkennummer muss genau 7 Ziffern haben.');return;}
    const btn=document.querySelector('#edit-modal .btn-save');
    btn.disabled=true; btn.textContent='Speichert …';
    try {
      await db.collection('entries').doc(editingDocId).update({
        wildart:document.getElementById('edit-wildart').value,
        marke:marke||'',
        geschlecht:document.getElementById('edit-geschlecht').value||'',
        gewicht:document.getElementById('edit-gewicht').value||'',
        ak:document.getElementById('edit-ak').value||'',
        revier:document.getElementById('edit-revier').value||'',
        erleger:document.getElementById('edit-erleger').value.trim()||'',
        datum:document.getElementById('edit-datum').value||'',
        anmerkung:document.getElementById('edit-anmerkung').value||''
      });
      closeEditModal();
      showToast('success','✓ Eintrag aktualisiert!');
    } catch(e){alert('Fehler: '+e.message);}
    finally{btn.disabled=false;btn.textContent='Änderungen speichern';}
  }
  async function deleteFromModal() {
    if(!editingDocId||!confirm('Eintrag wirklich löschen?')) return;
    try{
      await db.collection('entries').doc(editingDocId).delete();
      closeEditModal();
    }catch(e){alert('Fehler: '+e.message);}
  }

  // ── Render list ────────────────────────────────────────────────
  function fmtDate(d) {
    if(!d) return '–';
    const p=d.split('-'); if(p.length!==3) return d;
    return p[2]+'.'+p[1]+'.'+p[0];
  }
  function renderListe() {
    const entries=getFilteredEntries();
    const el=document.getElementById('liste-content'); if(!el) return;
    if(!entries.length){el.innerHTML='<div class="empty">Keine Einträge für diese Auswahl.</div>';return;}
    el.innerHTML=entries.map(e=>`
      <div class="list-item">
        <div class="list-top">
          <span class="list-wildart">${e.wildart||'–'}</span>
          <div class="list-right">
            <span class="list-date">${fmtDate(e.datum)}</span>
            <button class="icon-btn" onclick="openEditModal(${e.id})" title="Bearbeiten">✏️</button>
          </div>
        </div>
        <div class="list-meta">
          ${e.geschlecht?`<span class="pill">${e.geschlecht}</span>`:''}
          ${e.ak!==''&&e.ak!==undefined&&e.ak!==null?`<span class="pill">AK ${e.ak}</span>`:''}
          ${e.gewicht?`<span class="pill green">${parseFloat(e.gewicht).toFixed(1)} kg</span>`:''}
          ${e.marke?`<span class="pill">Nr. ${e.marke}</span>`:''}
        </div>
        ${e.revier?`<div class="list-revier">📍 ${e.revier}</div>`:''}
        ${e.erleger?`<div class="list-erleger">👤 ${e.erleger}</div>`:''}
        ${e.anmerkung?`<div class="list-anm">${e.anmerkung}</div>`:''}
        ${e.photo?`<div class="photo-link" onclick="viewPhoto(${e.id})">📷 Foto ansehen</div>`:''}
      </div>
    `).join('');
  }

  // ── Render stats ───────────────────────────────────────────────
  function renderStats() {
    const entries=getSeasonEntries(currentSeason);
    const el=document.getElementById('stats-content'); if(!el) return;
    if(!entries.length){el.innerHTML='<div class="empty">Keine Daten für diese Saison.</div>';return;}

    const total=entries.length;
    const allReviere=[...new Set(entries.map(e=>e.revier).filter(Boolean))].sort();
    const allWildarten=[...new Set(entries.map(e=>e.wildart).filter(Boolean))].sort();
    const allErleger=[...new Set(entries.map(e=>e.erleger).filter(Boolean))].sort();

    // ── Gesamtstrecke oben ──────────────────────────────────────
    const totalHTML=`<div class="stats-grid" style="margin-bottom:20px;">
      <div class="stat-card" style="grid-column:1/-1;"><div class="stat-label">Gesamtstrecke Saison ${currentSeason}</div><div class="stat-value">${total}</div></div>
    </div>`;

    // ── Wildart x Revier ────────────────────────────────────────
    let wildRevierHTML='';
    allWildarten.forEach(w=>{
      const revierCounts={};
      allReviere.forEach(r=>{
        const c=entries.filter(e=>e.wildart===w&&e.revier===r).length;
        if(c>0) revierCounts[r]=c;
      });
      if(!Object.keys(revierCounts).length) return;
      const totalW=entries.filter(e=>e.wildart===w).length;
      const maxC=Math.max(...Object.values(revierCounts),1);
      wildRevierHTML+=`<div class="sub-section">
        <div class="sub-title">${w} <span style="font-weight:400;color:var(--text2);">— ${totalW} gesamt</span></div>
        ${Object.entries(revierCounts).sort((a,b)=>b[1]-a[1]).map(([r,c])=>`
          <div class="bar-row">
            <div class="bar-lbl">${r}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/maxC*100)}%"></div></div>
            <div class="bar-n">${c}</div>
          </div>`).join('')}
      </div>`;
    });

    // ── Pro Erleger: Wildart x Revier ───────────────────────────
    let erlegerHTML='';
    allErleger.forEach(name=>{
      const eEntries=entries.filter(e=>e.erleger===name);
      const totalE=eEntries.length;
      const eWildarten=[...new Set(eEntries.map(e=>e.wildart).filter(Boolean))].sort();

      const wildCounts={};
      eWildarten.forEach(w=>{ wildCounts[w]=eEntries.filter(e=>e.wildart===w).length; });
      const maxC=Math.max(...Object.values(wildCounts),1);
      const erlegerWildHTML=Object.entries(wildCounts).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`
        <div class="bar-row">
          <div class="bar-lbl">${w}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c/maxC*100)}%"></div></div>
          <div class="bar-n">${c}</div>
        </div>`).join('');

      erlegerHTML+=`<div class="sub-section">
        <div class="sub-title">👤 ${name} <span style="font-weight:400;color:var(--text2);">— ${totalE} gesamt</span></div>
        ${erlegerWildHTML}
      </div>`;
    });

    el.innerHTML=`
      ${totalHTML}
      ${wildRevierHTML?`<div class="chart-section">
        <div class="chart-title">Strecke nach Wildart & Revier</div>
        ${wildRevierHTML}
      </div>`:''}
      ${erlegerHTML?`<div class="chart-section">
        <div class="chart-title">Statistik pro Erleger</div>
        ${erlegerHTML}
      </div>`:''}
    `;
  }

  // ── Export CSV ─────────────────────────────────────────────────
  function exportCSV() {
    const season=document.getElementById('export-season-select').value||currentSeason;
    const entries=getSeasonEntries(season);
    if(!entries.length){alert('Keine Einträge für diese Saison.');return;}
    const headers=['Saison','Datum','Wildart','Wildmarkennummer','Geschlecht','Gewicht (kg)','Altersklasse (AK)','Revier','Erleger','Anmerkung'];
    const rows=entries.map(e=>[
      getSeason(e.datum)||'',e.datum||'',e.wildart||'',e.marke||'',
      e.geschlecht||'',e.gewicht||'',e.ak!==undefined?e.ak:'',
      e.revier||'',e.erleger||'',(e.anmerkung||'').replace(/"/g,'""')
    ].map(v=>`"${v}"`).join(';'));
    const csv='\uFEFF'+[headers.join(';'),...rows].join('\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`Jagd_Strecke_${season.replace('/','_')}.csv`;
    a.click(); URL.revokeObjectURL(url);
  }

  // ── View photo ─────────────────────────────────────────────────
  function viewPhoto(id) {
    const entry=allEntries.find(e=>e.id==id);
    if(!entry||!entry.photo) return;
    const overlay=document.createElement('div');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML='<img src="'+entry.photo+'" style="max-width:100%;max-height:90dvh;border-radius:10px;object-fit:contain;" /><button style="position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.15);color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit;">✕</button>';
    overlay.querySelector('button').onclick=()=>overlay.remove();
    overlay.onclick=(ev)=>{if(ev.target===overlay)overlay.remove();};
    document.body.appendChild(overlay);
  }

  // ── New entries notification ───────────────────────────────────
  let newEntriesShown = false;

  function checkNewEntries() {
    if (newEntriesShown) return;
    const lastSeen = parseInt(localStorage.getItem('jagd_last_seen') || '0');
    if (lastSeen === 0) {
      // First time opening — just save current timestamp, no notification
      localStorage.setItem('jagd_last_seen', Date.now().toString());
      return;
    }
    const newOnes = allEntries.filter(e => e.id > lastSeen);
    if (newOnes.length > 0) {
      newEntriesShown = true;
      showNewEntriesBanner(newOnes.length);
    }
    localStorage.setItem('jagd_last_seen', Date.now().toString());
  }

  function showNewEntriesBanner(count) {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:500;background:var(--text);color:var(--bg);padding:12px 20px;border-radius:30px;font-size:14px;font-weight:600;font-family:inherit;box-shadow:0 4px 20px rgba(0,0,0,0.2);display:flex;align-items:center;gap:10px;white-space:nowrap;';
    const text = count === 1 ? '🦌 1 neuer Abschuss eingetragen!' : `🦌 ${count} neue Abschüsse eingetragen!`;
    banner.innerHTML = `<span>${text}</span><button onclick="this.parentElement.remove()" style="background:rgba(255,255,255,0.2);border:none;color:inherit;border-radius:20px;padding:2px 8px;cursor:pointer;font-size:13px;font-family:inherit;">✕</button>`;
    document.body.appendChild(banner);
    setTimeout(() => { if (banner.parentElement) banner.remove(); }, 5000);
  }

  // ── Init ───────────────────────────────────────────────────────
  document.getElementById('datum').value=new Date().toISOString().split('T')[0];
  availableSeasons=[currentSeasonNow()];
  currentSeason=currentSeasonNow();
  buildSeasonSelect();
  buildExportSeasonSelect();
</script>
</body>
</html>
